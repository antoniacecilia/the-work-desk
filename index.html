<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>The Work Desk</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- Loaded in <head> with `defer` so custom components register before <a-scene> initializes. -->
    <script src="js/main.js" defer></script>
  </head>

  <body>
    <a-scene
      renderer="colorManagement: true; physicallyCorrectLights: true"
      shadow="type: pcfsoft"
    >
      <a-assets>
        <a-asset-item id="roomModel" src="assets/models/Room_blockoutglb.glb"></a-asset-item>
        <a-asset-item id="lampModel" src="assets/models/Lamp_blockoutglb.glb"></a-asset-item>
      </a-assets>

      <!-- Night sky — visible through the windows, sets the exterior colour for the evening mood. -->
      <a-sky color="#08111f"></a-sky>

      <!-- Moon: flat-shaded white sphere placed along the same world-space ray as the directional
           light (light is at (-5, 5, 1); moon sits further out along that vector at ~3× distance)
           so the light streaming into the room visually appears to come from it. -->
      <a-sphere
        id="moon"
        position="-15 15 3"
        radius="1.2"
        material="shader: flat; color: #ffffff"
      ></a-sphere>

      <!-- Camera rig: WASD on the body, look-controls on the head, controllers as siblings of the head so they translate with the rig. -->
      <a-entity
        id="rig"
        position="1 0 2"
        room-bounds="halfWidth: 2.5; halfDepth: 3; margin: 0.35"
        wasd-controls="acceleration: 5; fly: false"
      >
        <a-entity id="head" position="0 1.5 0" look-controls="pointerLockEnabled: true" sync-yaw-to-rig>
          <a-entity id="camera" camera></a-entity>
        </a-entity>

        <!-- VR controllers. `laser-controls` auto-loads the right driver (Oculus Touch, Vive, WMR, etc.) and adds a raycaster. -->
        <a-entity id="leftHand" laser-controls="hand: left"></a-entity>
        <a-entity id="rightHand" laser-controls="hand: right"></a-entity>
      </a-entity>

      <!-- Room model. `gltf-shadows` flips shadowSide to DoubleSide on every material
           so single-layer walls cast shadows from either side. -->
      <a-entity
        gltf-model="#roomModel"
        position="0 0 0"
        rotation="0 90 0"
        scale="1 1 1"
        gltf-shadows
      ></a-entity>

      <!-- Lamp opts out of receiving shadows: its cap normals point up (away from the point
           light below), so shadowNormalBias pushes cap receivers further from the light and
           they self-shadow against their own depth in the cubemap. The lamp doesn't need to
           receive shadows from anything realistic anyway, so we disable receive on this model. -->
      <a-entity
        gltf-model="#lampModel"
        position="0 0 0"
        rotation="0 0 0"
        scale="1 1 1"
        gltf-shadows="receive: false"
      ></a-entity>

      <!-- Rice paper orb: translucent sphere with the point light at its centre.
           `transparent` + low opacity lets the light read through the surface; `emissive` makes the
           orb visibly glow on its own, independent of which faces the point light directly hits.
           `side: double` renders the inside faces so the back of the sphere also shows the glow.
           `cast: false` on the orb means it does NOT block its own point light — only the opaque
           lamp GLB (stem + ceiling cap) casts shadows from this light. -->
      <a-entity id="lamp-orb" position="0 2.46967 0">
        <a-sphere
          radius="0.375"
          material="color: #ffe6c2;
                    emissive: #ffc488;
                    emissiveIntensity: 0.8;
                    transparent: true;
                    opacity: 0.45;
                    side: double"
          shadow="cast: false; receive: false"
        ></a-sphere>
        <!-- Point-light shadows use a 6-face cubemap. shadowCameraNear/Far must be tuned to the
             scene scale — defaults are 0.5/500, which makes depth values for nearby objects so
             tiny that even a small shadowBias swallows the entire receiver-vs-caster depth gap
             and the cap fails to shadow the ceiling. Near 0.1 / Far 8 keeps the relevant depths
             in a usable range. -->
        <a-light
          type="point"
          color="#ffc488"
          intensity="4"
          light="distance: 6;
                 decay: 2;
                 castShadow: true;
                 shadowMapWidth: 1024;
                 shadowMapHeight: 1024;
                 shadowCameraNear: 0.1;
                 shadowCameraFar: 8;
                 shadowBias: -0.003;
                 shadowRadius: 6"
          shadow-normal-bias="0.05"
        ></a-light>
      </a-entity>

      <!-- Fill light: soft ambient so shadow interiors aren't pure black. -->
      <a-light type="ambient" color="#a7c0d9" intensity="1"></a-light>

      <!-- Key light: directional "sun" slanting through the windows.
           Windows face -X in world space (Blender's glTF exporter sends Blender +Y → glTF -Z, then
           entity rotation 0 90 0 sends -Z → -X). Light position is on the -X side so it shines inward.
           Direction = (target - position); default target is origin, so the light travels +X and -Y.
           Shadow camera is an ortho box sized to the room; bias tuned for thin single-sided walls. -->
      <a-light
        type="directional"
        color="#7d9dc7"
        intensity="10"
        position="-5 5 1"
        light="castShadow: true;
               shadowMapWidth: 2048;
               shadowMapHeight: 2048;
               shadowCameraLeft: -6;
               shadowCameraRight: 6;
               shadowCameraTop: 6;
               shadowCameraBottom: -6;
               shadowCameraNear: 0.1;
               shadowCameraFar: 20;
               shadowBias: -0.0005"
      ></a-light>
    </a-scene>
  </body>
</html>
