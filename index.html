<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>The Work Desk</title>

    <!-- A-Frame 1.7 + super-three 0.173.4 loaded as ES modules via importmap. This is the
         A-Frame-recommended setup since 1.7's post-processing support landed — it lets
         user-space modules import three.js postprocessing addons that share the same THREE
         instance as A-Frame's bundled renderer. Must be the first script tag in <head>. -->
    <script type="importmap">
      {
        "imports": {
          "aframe": "https://cdn.jsdelivr.net/npm/aframe@1.7.0/dist/aframe-master.module.min.js",
          "three": "https://cdn.jsdelivr.net/npm/super-three@0.173.4/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/super-three@0.173.4/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="js/main.js"></script>
  </head>

  <body>
    <a-scene
      renderer="colorManagement: true; toneMapping: ACESFilmic"
      shadow="type: pcfsoft"
      bloom="threshold: 1; strength: 0.5; radius: 1"
    >
      <a-assets>
        <a-asset-item id="roomModel" src="assets/models/Room_blockoutglb.glb"></a-asset-item>
        <a-asset-item id="lampModel" src="assets/models/Lamp_blockoutglb.glb"></a-asset-item>
      </a-assets>

      <!-- Night sky — visible through the windows, sets the exterior colour for the evening mood. -->
      <a-sky color="#08111f"></a-sky>

      <!-- Moon: flat-shaded white sphere placed along the same world-space ray as the directional
           light (light is at (-5, 5, 1); moon sits further out along that vector at ~3× distance)
           so the light streaming into the room visually appears to come from it. -->
      <!-- Black base + bright emissive: bloom only catches pixels with linear values >1 (the
           HDR threshold), and `shader: flat`/MeshBasicMaterial doesn't support emissive. Using
           the default standard shader with color=black and emissiveIntensity>1 pushes the moon
           into HDR range so it actually blooms, without any direct-light contribution. -->
      <a-sphere
        id="moon"
        position="-15 15 3"
        radius="1.2"
        material="color: #000000;
                  emissive: #ffffff;
                  emissiveIntensity: 1.5;
                  roughness: 1;
                  metalness: 0"
      ></a-sphere>

      <!-- Camera rig: WASD on the body, look-controls on the head, controllers as siblings of the head so they translate with the rig. -->
      <a-entity
        id="rig"
        position="1 0 2"
        room-bounds="halfWidth: 2.5; halfDepth: 3; margin: 0.35"
        wasd-controls="acceleration: 5; fly: false"
      >
        <a-entity id="head" position="0 1.5 0" look-controls="pointerLockEnabled: true" sync-yaw-to-rig>
          <a-entity id="camera" camera></a-entity>
        </a-entity>

        <!-- VR controllers. `laser-controls` auto-loads the right driver per device and adds a raycaster. -->
        <a-entity id="leftHand" laser-controls="hand: left"></a-entity>
        <a-entity id="rightHand" laser-controls="hand: right"></a-entity>
      </a-entity>

      <!-- Room model. `gltf-shadows` flips shadowSide to DoubleSide on every material
           so single-layer walls cast shadows from either side. -->
      <a-entity
        gltf-model="#roomModel"
        rotation="0 90 0"
        gltf-shadows
      ></a-entity>

      <!-- Lamp opts out of receiving shadows: its cap normals point up (away from the point
           light below), so shadowNormalBias pushes cap receivers further from the light and
           they self-shadow against their own depth in the cubemap. The lamp doesn't need to
           receive shadows from anything realistic anyway, so we disable receive on this model. -->
      <a-entity
        gltf-model="#lampModel"
        gltf-shadows="receive: false"
      ></a-entity>

      <!-- Rice paper orb: dark warm base so direct-light reflection on its inner surface doesn't
           saturate; emissive does the visible "lit paper" glow. `side: double` renders the inside
           faces so the back of the sphere also shows the glow. `cast: false` on the orb means it
           does NOT block its own point light — only the opaque lamp GLB casts shadows from it. -->
      <a-entity id="lamp-orb" position="0 2.46967 0">
        <a-sphere
          radius="0.375"
          material="color: #2a1f10;
                    emissive: #ffc488;
                    emissiveIntensity: 1.5;
                    transparent: true;
                    opacity: 0.4;
                    side: double;
                    roughness: 1;
                    metalness: 0"
          shadow="cast: false; receive: false"
        ></a-sphere>
        <!-- Bulb: small emissive sphere at the point light's exact position so the orb visibly
             contains a "source". `cast: false` keeps it out of the shadow cubemap — otherwise
             it would block the point light's own rays from escaping. -->
        <a-sphere
          radius="0.1"
          material="color: #fff2d4;
                    emissive: #ffc488;
                    emissiveIntensity: 3"
          shadow="cast: false; receive: false"
        ></a-sphere>
        <!-- Point-light shadows use a 6-face cubemap. shadowCameraNear/Far must be tuned to the
             scene scale — defaults are 0.5/500, which makes depth values for nearby objects so
             tiny that even a small shadowBias swallows the entire receiver-vs-caster depth gap
             and the cap fails to shadow the ceiling. Near 0.1 / Far 8 keeps the relevant depths
             in a usable range. -->
        <a-light
          type="point"
          color="#ffc488"
          intensity="4"
          light="distance: 6;
                 decay: 2;
                 castShadow: true;
                 shadowMapWidth: 1024;
                 shadowMapHeight: 1024;
                 shadowCameraNear: 0.1;
                 shadowCameraFar: 8;
                 shadowBias: -0.003;
                 shadowRadius: 6"
          shadow-normal-bias="0.05"
        ></a-light>
      </a-entity>

      <!-- Fill light: soft ambient so shadow interiors aren't pure black. -->
      <a-light type="ambient" color="#a7c0d9" intensity="1"></a-light>

      <!-- Key light: directional "sun" slanting through the windows.
           Windows face -X in world space (Blender's glTF exporter sends Blender +Y → glTF -Z, then
           entity rotation 0 90 0 sends -Z → -X). Light position is on the -X side so it shines inward.
           Direction = (target - position); default target is origin, so the light travels +X and -Y.
           Shadow camera is an ortho box sized to the room; bias tuned for thin single-sided walls. -->
      <a-light
        type="directional"
        color="#7d9dc7"
        intensity="10"
        position="-5 5 1"
        light="castShadow: true;
               shadowMapWidth: 2048;
               shadowMapHeight: 2048;
               shadowCameraLeft: -6;
               shadowCameraRight: 6;
               shadowCameraTop: 6;
               shadowCameraBottom: -6;
               shadowCameraNear: 0.1;
               shadowCameraFar: 20;
               shadowBias: -0.0005"
      ></a-light>
    </a-scene>
  </body>
</html>
